name: Build iOS Mihomo A-B

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-libmihomo-variant.sh'
      - 'ios-probe/**'
      - '.github/workflows/ios-libmihomo.yml'
  workflow_dispatch:

concurrency:
  group: ios-libmihomo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        variant: [legacy, current]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install gomobile toolchain
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260410095206-2cfb76559b7b
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260410095206-2cfb76559b7b
          gomobile init
      - name: Build Libmihomo device XCFramework
        run: bash scripts/build-libmihomo-variant.sh '${{ matrix.variant }}'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Link XCFramework into transport probe
        run: |
          rm -rf ios-probe/Frameworks
          mkdir -p ios-probe/Frameworks
          cp -R 'dist/libmihomo-${{ matrix.variant }}/Libmihomo.xcframework' ios-probe/Frameworks/
          cd ios-probe
          xcodegen generate
          xcodebuild \
            -project WLOCTransportProbe.xcodeproj \
            -scheme WLOCTransportProbe \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - uses: actions/upload-artifact@v4
        with:
          name: libmihomo-ios-${{ matrix.variant }}
          path: dist/libmihomo-${{ matrix.variant }}/
          if-no-files-found: error
          compression-level: 6
