name: Validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: coredevice-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-loopback:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v
