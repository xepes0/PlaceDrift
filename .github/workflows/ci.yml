name: Validate PlaceDrift

on:
  push:
    branches: [placedrift-mainline]
  pull_request:

concurrency:
  group: placedrift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-coredevice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust version
        run: rustc --version
      - name: Check
        working-directory: native/coredevice
        run: cargo check
      - name: Test
        working-directory: native/coredevice
        run: cargo test --lib

  ios-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned PlaceDrift app
        run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PlaceDrift-unsigned
          path: .build/artifacts/PlaceDrift-unsigned.ipa
          if-no-files-found: error
