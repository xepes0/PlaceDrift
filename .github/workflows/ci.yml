name: Validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: coredevice-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node version
        run: node --version
      - name: Validate Clash Mi override and browser transport page
        run: node scripts/check-browser-wasm-override.mjs

  swift-loopback:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  rust-coredevice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust version
        run: rustc --version
      - name: Check
        working-directory: native/coredevice
        run: cargo check --locked || cargo check
      - name: Test
        working-directory: native/coredevice
        run: cargo test --lib

  ios-coredevice-probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned iOS probe
        run: bash scripts/build-ios-coredevice-probe.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WLOCCoreDeviceProbe-unsigned
          path: .build/artifacts/WLOCCoreDeviceProbe-unsigned.ipa
          if-no-files-found: error

  mihomo-sing-tun-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sing_tun: v0.4.21
            legacy_patch: '1'
          - sing_tun: v0.4.22
            legacy_patch: '1'
          - sing_tun: v0.4.24
            legacy_patch: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Compile Mihomo 1.19.31 TUN with selected sing-tun
        env:
          MIHOMO_VERSION: v1.19.31
          SING_TUN_VERSION: ${{ matrix.sing_tun }}
          PATCH_LEGACY_API: ${{ matrix.legacy_patch }}
        run: bash scripts/check-mihomo-sing-tun.sh
