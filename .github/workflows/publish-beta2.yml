name: Publish Public Beta 2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-beta2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-15
    steps:
      - name: Check out tested Build 17 source
        uses: actions/checkout@v4
        with:
          ref: 9203edb38baedb0d4849309d7aab4e4fdb8b0d13

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned PlaceDrift IPA
        run: bash scripts/build-app.sh

      - name: Prepare release asset
        run: cp .build/artifacts/PlaceDrift-unsigned.ipa PlaceDrift-0.2.1-Public-Beta-2-unsigned.ipa

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1-beta.2
          target_commitish: 9203edb38baedb0d4849309d7aab4e4fdb8b0d13
          name: PlaceDrift 0.2.1 Public Beta 2
          prerelease: true
          body: |
            ## PlaceDrift 0.2.1 Public Beta 2 — Build 17

            Beta 2 focuses on SideStore/resigning compatibility for Maps sharing.

            ### Fixed
            - Fixes the case where manually entered coordinates work, but the Maps Share Extension cannot reach the PlaceDrift host app after SideStore resigning.
            - Replaces the single fixed localhost share port with automatic loopback-port selection across `57874...57889`.
            - The Share Extension probes the same port pool and only accepts a valid PlaceDrift `OK` acknowledgement.
            - Share protocol is upgraded to v2 so an older installed PlaceDrift instance cannot accidentally consume Beta 2 share payloads.

            ### Existing verified path
            - Apple Maps / Amap / Baidu Maps → Share → PlaceDrift.
            - Map coordinate parsing remains fully local on-device; no WLOC Worker is used.
            - RemotePairing / DVT LocationSimulation behavior is unchanged from Public Beta 1.

            ### TUN compatibility tested so far
            Working: LocalDevVPN, Clash Mi, Clash, Karing.
            Currently failing the RemotePairing protocol check in tested configurations: Loon, Surge, Shadowrocket.

            PlaceDrift itself does not start a VPN.

            The attached IPA is unsigned and must be signed with your own valid signing identity before installation. Keep the embedded `PlaceDriftShare.appex` when resigning.
          files: PlaceDrift-0.2.1-Public-Beta-2-unsigned.ipa
