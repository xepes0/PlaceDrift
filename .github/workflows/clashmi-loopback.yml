name: Clash Mi loopback PoC
on:
  push:
    paths: ['experiments/clashmi-loopback/**', '.github/workflows/clashmi-loopback.yml']
  pull_request:
    paths: ['experiments/clashmi-loopback/**', '.github/workflows/clashmi-loopback.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/clashmi-loopback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiments/clashmi-loopback/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
