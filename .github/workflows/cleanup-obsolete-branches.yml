name: One-time obsolete branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete development branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            "browser-wasm"
            "clashmi-integration"
            "codex/clashmi-loopback-poc"
            "coredevice-probe"
            "feature/build11-local-parser-region"
            "feature/build12-local-only-parser"
            "feature/build12-local-only-parser-check"
            "feature/build13-localization-cleanup"
            "feature/build13-localized-region-refresh"
            "feature/build14-shortcuts-local-map"
            "feature/build15-public-beta"
            "feature/maps-share-background"
            "fix/remote-pairing-routing"
            "locshift-mainline"
            "placedrift-mainline"
            "wloc-app-mainline"
          )

          for branch in "${branches[@]}"; do
            echo "Deleting $branch"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || {
              echo "Failed to delete $branch" >&2
              exit 1
            }
          done

          echo "Obsolete branch cleanup complete. Kept: main, release/0.1.1, release/0.2.1"
