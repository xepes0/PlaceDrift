name: WLOCCoreDeviceProbe
options:
  bundleIdPrefix: com.xepes.wlocprobe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  WLOCCoreDeviceProbe:
    type: application
    platform: iOS
    sources:
      - path: ProbeApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ProbeApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.xepes.wlocprobe.coredevice
        PRODUCT_NAME: WLOCCoreDeviceProbe
        SWIFT_OBJC_BRIDGING_HEADER: ProbeApp/WLOCProbe-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/include"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Vendor"
        OTHER_LDFLAGS: "$(inherited) -lwloc_coredevice_engine"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
    scheme:
      gatherCoverageData: false
