name: WLOCTransportProbe
options:
  bundleIdPrefix: com.xepes.wlocprobe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  WLOCTransportProbe:
    type: application
    platform: iOS
    sources:
      - path: ProbeApp
    dependencies:
      - target: ProbeTunnel
        embed: true
        codeSign: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: ProbeApp/ProbeApp.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "WLOC Transport Probe"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.xepes.wlocprobe.app
        SWIFT_VERSION: "5.0"
    scheme:
      gatherCoverageData: false

  ProbeTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: ProbeTunnel
    dependencies:
      - framework: Frameworks/Libmihomo.xcframework
        embed: false
      - sdk: libresolv.tbd
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: ProbeTunnel/ProbeTunnel.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ProbeTunnel/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.xepes.wlocprobe.app.tunnel
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
