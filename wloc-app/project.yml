name: WLOC
options:
  bundleIdPrefix: com.xepes.wloc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  WLOC:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.xepes.wloc.coredevice
        PRODUCT_NAME: WLOC
        SWIFT_OBJC_BRIDGING_HEADER: App/WLOCApp-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/include"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Vendor"
        OTHER_LDFLAGS: "$(inherited) -lwloc_coredevice_engine"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
    scheme:
      gatherCoverageData: false
