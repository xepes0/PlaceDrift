# Minimal transport smoke-test profile. Do not merge into a production profile.
mode: rule
log-level: debug
mixed-port: 7890
allow-lan: false

proxies: []
proxy-groups: []

rules:
  - MATCH,DIRECT

tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  loopback-address:
    - 10.7.0.1
