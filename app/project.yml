name: PlaceDrift
options:
  bundleIdPrefix: com.xepes.placedrift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  PlaceDrift:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: ShareExtension/AppleMapsCoordinateResolver.swift
      - path: ShareExtension/BaiduWebViewCoordinateResolver.swift
    dependencies:
      - target: PlaceDriftShare
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.xepes.placedrift
        PRODUCT_NAME: PlaceDrift
        SWIFT_OBJC_BRIDGING_HEADER: App/PlaceDrift-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/include"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Vendor"
        OTHER_LDFLAGS: "$(inherited) -lplacedrift_coredevice_engine"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
    scheme:
      gatherCoverageData: false

  PlaceDriftShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.xepes.placedrift.share
        PRODUCT_NAME: PlaceDriftShare
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
